services:

  mariadb:
    image: mariadb:11.4
    container_name: glpi-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?required}
      MYSQL_USER: ${MYSQL_USER:?required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  glpi:
    image: ${GLPI_IMAGE:-glpi/glpi:11.0-nightly}
    container_name: glpi-app
    restart: unless-stopped
    environment:
      TIMEZONE: ${TIMEZONE:-Africa/Lagos}
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - glpi_data:/var/www/html/glpi
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/status.php"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
  
  nginx:
    image: nginx:1.27-alpine
    container_name: glpi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      glpi:
        condition: service_healthy
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 5

  glpi-redis:
    image: redis:7.2-alpine
    container_name: glpi-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5  

  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: glpi-cloudflared
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?required}
  #   depends_on:
  #     nginx:
  #       condition: service_healthy
  #   networks:
  #     - frontend

  prometheus:
    image: prom/prometheus:latest
    container_name: glpi-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
      - backend  
  
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: glpi-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: glpi-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring


networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true   
  monitoring:
    driver: bridge
    internal: true

volumes:
  mariadb_data:
  glpi_data:
  prometheus_data:
  redis_data:
  grafana_data:
